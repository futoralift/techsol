<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="techsolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FF5500" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="32" height="32" rx="7" fill="#0A0A0E" />
  <rect width="31" height="31" x="0.5" y="0.5" rx="6.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- TechSol Brand Geometric Mark -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Left Polygon Wing -->
    <path d="M2 3 L8 3 L5 17 L2 17 Z" fill="url(#techsolGrad)" />
    <!-- Right Tech Polygon -->
    <path d="M9 3 L18 3 L15 10 L6 10 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M14 10 L18 10 L15 17 L11 17 Z" fill="url(#techsolGrad)" />
  </g>
